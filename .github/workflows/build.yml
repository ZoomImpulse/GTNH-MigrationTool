name: Build GTNH Migrator

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\GTNHMigrator.Tests\GTNHMigrator.Tests.csproj --runtime win-x64

      - name: Build application
        run: dotnet build .\GTNHMigrator.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build .\GTNHMigrator.Tests\GTNHMigrator.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test .\GTNHMigrator.Tests\GTNHMigrator.Tests.csproj --configuration Release --no-restore --no-build

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish .\GTNHMigrator.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output .\artifacts\gtnh-migrator-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: gtnh-migrator-win-x64-${{ github.sha }}
          path: .\artifacts\gtnh-migrator-win-x64\
          if-no-files-found: error
          retention-days: 14

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\gtnh-migrator-win-x64\* -DestinationPath .\artifacts\gtnh-migrator-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          .\artifacts\gtnh-migrator-win-x64.zip
          --title "GTNH Migrator ${{ github.ref_name }}"
          --generate-notes
